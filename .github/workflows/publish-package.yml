name: Publish release to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: package-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download and verify the existing release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,targetCommitish,assets > release.json
          mkdir package
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir package --pattern 'RTLAirLink-*.zip' \
            --pattern BUILD_REPORT.json --pattern RELEASE_MANIFEST.json \
            --pattern SHA256SUMS --pattern install-rtlairlink.sh
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          release = json.loads(Path('release.json').read_text())
          assert release['tagName'] == tag and not release['isDraft']
          folder = Path('package')
          names = {f'RTLAirLink-{tag}-x86_64.zip', f'RTLAirLink-{tag}-source.zip',
                   'BUILD_REPORT.json', 'RELEASE_MANIFEST.json', 'SHA256SUMS'}
          if any(a['name'] == 'install-rtlairlink.sh' for a in release['assets']):
              names.add('install-rtlairlink.sh')
          assert {p.name for p in folder.iterdir()} == names
          sums = {}
          for line in (folder / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name in names - {'SHA256SUMS'} and name not in sums
              assert hashlib.sha256((folder / name).read_bytes()).hexdigest() == digest
              sums[name] = digest
          assert set(sums) == names - {'SHA256SUMS'}
          for asset in release['assets']:
              if asset['name'] in names:
                  digest = asset.get('digest')
                  assert digest and digest == 'sha256:' + hashlib.sha256(
                      (folder / asset['name']).read_bytes()).hexdigest()
          manifest = json.loads((folder / 'RELEASE_MANIFEST.json').read_text())
          assert manifest['release'] == tag
          assert manifest['repository'].lower() == os.environ['GITHUB_REPOSITORY'].lower()
          for kind in ['binary', 'source']:
              assert sums[manifest[f'{kind}_archive']] == manifest[f'{kind}_archive_sha256']
          revision = manifest['source_commit']
          assert len(revision) == 40 and all(c in '0123456789abcdef' for c in revision)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SOURCE_REVISION={revision}\n')
              env.write('PACKAGE=ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '\n')
          print(f'All {len(names)} release files verified against release digests and checksums.')
          PY

      - name: Install pinned ORAS CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz \
            --output oras.tar.gz
          printf '%s  %s\n' \
            66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0 \
            oras.tar.gz | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oras-bin"
          tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oras-bin" oras
          echo "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"

      - name: Publish the paired kext release as an OCI artifact
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          installer=()
          if [[ -f install-rtlairlink.sh ]]; then installer+=('install-rtlairlink.sh:text/x-shellscript'); fi
          oras push "$PACKAGE:$RELEASE_TAG" \
            --artifact-type application/vnd.rtlairlink.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --annotation 'org.opencontainers.image.title=RTLAirLink' \
            --annotation 'org.opencontainers.image.description=Experimental Realtek macOS kext release: paired binaries, corresponding source, build report and checksums. See LICENSES for dependency and firmware terms.' \
            --annotation "org.opencontainers.image.version=$RELEASE_TAG" \
            --annotation "org.opencontainers.image.revision=$SOURCE_REVISION" \
            "RTLAirLink-$RELEASE_TAG-x86_64.zip:application/zip" \
            "RTLAirLink-$RELEASE_TAG-source.zip:application/zip" \
            BUILD_REPORT.json:application/json RELEASE_MANIFEST.json:application/json \
            SHA256SUMS:text/plain "${installer[@]}"

      - name: Pull the published digest and verify every file
        shell: bash
        run: |
          set -euo pipefail
          digest="$(oras resolve "$PACKAGE:$RELEASE_TAG")"
          oras pull "$PACKAGE@$digest" --output verification
          diff --recursive package verification
          (cd verification && sha256sum --check --strict SHA256SUMS)
          {
            echo '### RTLAirLink package published and verified'
            echo
            echo "Package: https://github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/package/rtlairlink"
            echo
            echo "Reference: \`$PACKAGE:$RELEASE_TAG\`"
            echo
            echo "Digest: \`$digest\`"
            echo
            echo 'All downloaded files match the original release byte for byte.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of the registry
        if: always()
        run: |
          if command -v oras >/dev/null; then oras logout ghcr.io; fi
